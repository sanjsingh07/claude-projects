<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Cosmic Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(9% 0.015 265);
  --surface: oklch(12% 0.018 265);
  --fg: oklch(98% 0.004 265);
  --muted: oklch(62% 0.018 265);
  --border: oklch(20% 0.02 265);
  --accent-violet: oklch(62% 0.18 290);
  --accent-pink: oklch(72% 0.22 10);
  --accent-amber: oklch(82% 0.18 75);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { display: flex; align-items: center; justify-content: center; }

.frame { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-radius: 47px; border: 1.5px solid var(--border); }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 10; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 14px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; z-index: 5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size: 15px; font-weight: 600; color: var(--fg); }
.status-bar .right { display: flex; align-items: center; gap: 5px; }

.screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding: 54px 0 34px; overflow: hidden; }

/* Toggle State Logic */
#chart-toggle { display: none; }
.vedic-view { display: none; }
.natal-view { display: block; }

#chart-toggle:checked ~ .screen .vedic-view { display: block; }
#chart-toggle:checked ~ .screen .natal-view { display: none; }
#chart-toggle:checked ~ .screen .toggle-btn .toggle-text-natal { display: none; }
#chart-toggle:checked ~ .screen .toggle-btn .toggle-text-vedic { display: inline; }
#chart-toggle:checked ~ .screen .header-title .title-natal { display: none; }
#chart-toggle:checked ~ .screen .header-title .title-vedic { display: inline; }

/* Header */
.header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.header-title { font-family: var(--font-display); font-size: 24px; font-style: italic; color: var(--fg); text-transform: uppercase; }
.title-vedic { display: none; }

.toggle-btn { 
  display: flex; align-items: center; gap: 8px; 
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); 
  background: var(--surface); cursor: pointer;
}
.toggle-text { font-family: var(--font-body); font-size: 13px; color: var(--fg); }
.toggle-text-vedic { display: none; }
.toggle-icon { font-size: 16px; color: var(--accent-violet); }

/* Content Scroll */
.content { flex: 1; overflow-y: auto; padding: 24px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }

/* Chart Visualization */
.chart-viz { 
  width: 100%; aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border); 
  margin-bottom: 24px; position: relative; 
  background: radial-gradient(circle at center, oklch(15% 0.02 265) 0%, transparent 80%);
  display: flex; align-items: center; justify-content: center;
}
.viz-label { font-family: var(--font-display); font-size: 20px; color: var(--fg); opacity: 0.6; font-style: italic; }

/* Info Section */
.section { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
.section-label { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-violet); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: none; }
.row .key { font-family: var(--font-body); font-size: 14px; color: var(--muted); }
.row .val { font-family: var(--font-display); font-size: 16px; color: var(--fg); font-style: italic; }

.sign-badge { display: flex; align-items: center; gap: 8px; }
.sign-ico { font-size: 20px; color: var(--accent-pink); }

/* Tab bar */
.tab-bar { display: flex; border-top: 1px solid var(--border); flex-shrink: 0; padding-top: 2px; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; color: var(--muted); transition: color 0.2s; font-family: var(--font-body); font-size: 9px; letter-spacing: 0.05em; }
.tab-item.active { color: var(--fg); }
.tab-item .ico { font-size: 20px; line-height: 1; }
.tab-item .tab-rule { width: 16px; height: 2px; background: var(--accent-violet); border-radius: 1px; opacity: 0; transition: opacity 0.2s; }
.tab-item.active .tab-rule { opacity: 1; }
.indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.3; z-index: 5; }

</style>
</head>
<body>
<input type="checkbox" id="chart-toggle">

<div class="frame">
  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M1 4.5C1 3.67 1.67 3 2.5 3S4 3.67 4 4.5v3C4 8.33 3.33 9 2.5 9S1 8.33 1 7.5v-3zM6 4C6 3.45 6.45 3 7 3s1 .45 1 1v3c0 .55-.45 1-1 1s-1-.45-1-1V4zm2.5 0c0-.55.45-1 1-1s1 .45 1 1v3c0 .55-.45 1-1 1s-1-.45-1-1V4zm5-1c.83 0 1.5.67 1.5 1.5v3c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-3C12.5 3.45 13 3 13.5 3zm-1.5 5c.83 0 1.5.67 1.5 1.5S15.33 11 14.5 11s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.4C5.51 2.4 3.5 3.74 3.5 5.2c0 2.1 4.5 4.8 4.5 4.8S12.5 7.3 12.5 5.2C12.5 3.74 10.49 2.4 8 2.4z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    </div>
  </div>

  <div class="screen">
    <div class="header">
      <div class="header-title">
        <span class="title-natal">Your Natal Chart</span>
        <span class="title-vedic">Vedic Chart</span>
      </div>
      <label for="chart-toggle" class="toggle-btn">
        <span class="toggle-text toggle-text-natal">Show Vedic</span>
        <span class="toggle-text toggle-text-vedic">Show Western</span>
        <span class="toggle-icon">☇</span>
      </label>
    </div>

    <div class="content">
      <!-- Natal View -->
      <div class="natal-view">
        <div class="chart-viz">
          <div class="viz-label">Western Wheel</div>
        </div>
        
        <div class="section">
          <div class="section-label">Core Positions</div>
          <div class="card">
            <div class="row">
              <span class="key">Sun</span>
              <div class="sign-badge">
                <span class="sign-ico">♈</span>
                <span class="val">Aries 15°</span>
              </div>
            </div>
            <div class="row">
              <span class="key">Moon</span>
              <div class="sign-badge">
                <span class="sign-ico">♋</span>
                <span class="val">Cancer 2°</span>
              </div>
            </div>
            <div class="row">
              <span class="key">Rising</span>
              <div class="sign-badge">
                <span class="sign-ico">♏</span>
                <span class="val">Scorpio 22°</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Vedic View -->
      <div class="vedic-view">
        <div class="chart-viz" style="border-radius: 12px; border-style: solid;">
          <div class="viz-label">Vedic Square (South)</div>
        </div>

        <div class="section">
          <div class="section-label">Sidereal Positions</div>
          <div class="card">
            <div class="row">
              <span class="key">Nakshatra</span>
              <span class="val">Ashwini (Pada 3)</span>
            </div>
            <div class="row">
              <span class="key">Ayanamsa</span>
              <span class="val">Lahiri (24.1°)</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <div class="tab-item active">
        <div class="tab-rule"></div><div class="ico">⊙</div><div>Chart</div>
      </div>
      <div class="tab-item">
        <div class="tab-rule"></div><div class="ico">✦</div><div>Daily</div>
      </div>
      <div class="tab-item">
        <div class="tab-rule"></div><div class="ico">☇</div><div>Transits</div>
      </div>
      <div class="tab-item">
        <div class="tab-rule"></div><div class="ico">♡</div><div>Match</div>
      </div>
      <div class="tab-item">
        <div class="tab-rule"></div><div class="ico">◎</div><div>Profile</div>
      </div>
    </div>
  </div>

  <div class="indicator"></div>
</div>
</body>
</html>
