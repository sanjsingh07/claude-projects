<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(9% 0.015 265);
  --surface: oklch(12% 0.018 265);
  --fg: oklch(98% 0.004 265);
  --muted: oklch(62% 0.018 265);
  --border: oklch(20% 0.02 265);
  --accent-violet: oklch(62% 0.18 290);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { display: flex; align-items: center; justify-content: center; }

.frame { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-radius: 47px; border: 1.5px solid var(--border); }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 10; }

.screen { flex: 1; display: flex; flex-direction: column; padding: 80px 32px 60px; }

.back-btn { font-size: 24px; color: var(--fg); margin-bottom: 32px; cursor: pointer; width: 40px; }

.header { margin-bottom: 40px; }
.title { font-family: var(--font-display); font-size: 36px; font-style: italic; color: var(--fg); line-height: 1.1; margin-bottom: 8px; }
.subtitle { font-family: var(--font-body); font-size: 15px; color: var(--muted); }

.form { display: flex; flex-direction: column; gap: 24px; }
.input-group { display: flex; flex-direction: column; gap: 8px; }
.label { font-family: var(--font-body); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.input { 
  height: 52px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 0 16px; font-family: var(--font-body); font-size: 15px; color: var(--fg);
  display: flex; align-items: center; width: 100%; outline: none;
}
.input::placeholder { color: var(--muted); }

.forgot-pw { text-align: right; margin-top: -12px; }
.forgot-pw a { font-family: var(--font-body); font-size: 13px; color: var(--accent-violet); text-decoration: none; }

.btn { 
  height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-body); font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  background: var(--fg); color: var(--bg); border: none; margin-top: 12px;
}

.alt-login { margin-top: auto; text-align: center; }
.alt-login-text { font-family: var(--font-body); font-size: 13px; color: var(--muted); margin-bottom: 20px; position: relative; }
.alt-login-text::before, .alt-login-text::after { content: ''; position: absolute; top: 50%; width: 25%; height: 1px; background: var(--border); }
.alt-login-text::before { left: 0; }
.alt-login-text::after { right: 0; }

.social-btns { display: flex; gap: 16px; justify-content: center; }
.social-btn { 
  width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--fg);
  background: var(--surface); cursor: pointer;
}

.indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.3; z-index: 5; }

</style>
</head>
<body>
<div class="frame">
  <div class="island"></div>
  
  <div class="screen">
    <div class="back-btn">←</div>

    <div class="header">
      <h2 class="title">Welcome back</h2>
      <p class="subtitle">Please enter your details to sign in.</p>
    </div>

    <div class="form">
      <div class="input-group">
        <label class="label">Email Address</label>
        <div class="input">alex.kim@example.com</div>
      </div>

      <div class="input-group">
        <label class="label">Password</label>
        <div class="input">••••••••••••</div>
      </div>

      <div class="forgot-pw">
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn">Sign In</button>
    </div>

    <div class="alt-login">
      <div class="alt-login-text">Or continue with</div>
      <div class="social-btns">
        <div class="social-btn"></div>
        <div class="social-btn">G</div>
      </div>
    </div>
  </div>
  
  <div class="indicator"></div>
</div>
</body>
</html>
