<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Natal Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,700;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(9% 0.015 265);
  --surface: oklch(12% 0.018 265);
  --fg: oklch(98% 0.004 265);
  --muted: oklch(62% 0.018 265);
  --border: oklch(20% 0.02 265);
  --accent-violet: oklch(62% 0.18 290);
  --accent-pink: oklch(72% 0.22 10);
  --accent-amber: oklch(82% 0.18 75);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { display: flex; align-items: center; justify-content: center; }

.frame { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-radius: 47px; border: 1.5px solid var(--border); }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 10; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 14px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; z-index: 5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; font-size: 15px; font-weight: 600; color: var(--fg); }
.status-bar .right { display: flex; align-items: center; gap: 5px; }
.screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding: 54px 0 34px; overflow: hidden; }

.header { padding: 0 24px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.header-title { font-family: var(--font-display); font-size: 28px; font-style: italic; color: var(--fg); }
.header-sub { font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-top: 3px; }

.content { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 24px; scrollbar-width: none; }
.content::-webkit-scrollbar { display: none; }

/* Visual Chart */
.chart-visual { width: 100%; aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.chart-ring { width: 100%; height: 100%; position: absolute; border: 1px solid var(--border); border-radius: 50%; }
.chart-ring.inner { width: 60%; height: 60%; }
.chart-line { position: absolute; width: 1px; height: 100%; background: var(--border); left: 50%; }
.chart-line.h { transform: rotate(90deg); }
.chart-line.d1 { transform: rotate(30deg); }
.chart-line.d2 { transform: rotate(60deg); }
.chart-line.d3 { transform: rotate(120deg); }
.chart-line.d4 { transform: rotate(150deg); }

.planet-point { 
  position: absolute; width: 8px; height: 8px; background: var(--fg); border-radius: 50%;
  box-shadow: 0 0 10px var(--accent-violet);
}

/* Planet List */
.section-label { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-violet); margin-bottom: 12px; }
.planet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.planet-card { 
  background: var(--surface); padding: 14px; border-radius: 16px; border: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.pc-top { display: flex; justify-content: space-between; align-items: center; }
.pc-label { font-family: var(--font-body); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.pc-glyph { font-size: 14px; color: var(--accent-pink); }
.pc-val { font-family: var(--font-display); font-size: 18px; color: var(--fg); }
.pc-deg { font-family: var(--font-body); font-size: 10px; color: var(--muted); }

/* Tab Bar */
.tab-bar { display: flex; border-top: 1px solid var(--border); flex-shrink: 0; padding-top: 2px; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer; color: var(--muted); transition: color 0.2s; font-family: var(--font-body); font-size: 9px; letter-spacing: 0.05em; }
.tab-item.active { color: var(--fg); }
.tab-item .ico { font-size: 20px; line-height: 1; }
.tab-item .tab-rule { width: 16px; height: 2px; background: var(--accent-violet); border-radius: 1px; opacity: 0; transition: opacity 0.2s; }
.tab-item.active .tab-rule { opacity: 1; }
.indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.3; z-index: 5; }

</style>
</head>
<body>
<div class="frame">
  <div class="island"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M1 4.5C1 3.67 1.67 3 2.5 3S4 3.67 4 4.5v3C4 8.33 3.33 9 2.5 9S1 8.33 1 7.5v-3zM6 4C6 3.45 6.45 3 7 3s1 .45 1 1v3c0 .55-.45 1-1 1s-1-.45-1-1V4zm2.5 0c0-.55.45-1 1-1s1 .45 1 1v3c0 .55-.45 1-1 1s-1-.45-1-1V4zm5-1c.83 0 1.5.67 1.5 1.5v3c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5v-3C12.5 3.45 13 3 13.5 3zm-1.5 5c.83 0 1.5.67 1.5 1.5S15.33 11 14.5 11s-1.5-.67-1.5-1.5.67-1.5 1.5-1.5z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2.4C5.51 2.4 3.5 3.74 3.5 5.2c0 2.1 4.5 4.8 4.5 4.8S12.5 7.3 12.5 5.2C12.5 3.74 10.49 2.4 8 2.4z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    </div>
  </div>

  <div class="screen">
    <div class="header">
      <div class="header-title">Natal Chart</div>
      <div class="header-sub">Born May 14, 1992 — London, UK</div>
    </div>

    <div class="content">
      <div class="chart-visual">
        <div class="chart-ring"></div>
        <div class="chart-ring inner"></div>
        <div class="chart-line"></div>
        <div class="chart-line h"></div>
        <div class="chart-line d1"></div>
        <div class="chart-line d2"></div>
        <div class="chart-line d3"></div>
        <div class="chart-line d4"></div>
        <!-- Sample planet positions -->
        <div class="planet-point" style="top: 20%; left: 30%;"></div>
        <div class="planet-point" style="top: 70%; left: 80%;"></div>
        <div class="planet-point" style="top: 15%; left: 65%;"></div>
        <div style="font-family: var(--font-display); font-size: 24px; color: var(--fg); z-index: 2; background: var(--bg); padding: 10px; border-radius: 50%; border: 1px solid var(--border);">Asc</div>
      </div>

      <div class="planet-section">
        <div class="section-label">Placements</div>
        <div class="planet-grid">
          <div class="planet-card">
            <div class="pc-top"><span class="pc-label">Sun</span> <span class="pc-glyph">☉</span></div>
            <div class="pc-val">Taurus</div>
            <div class="pc-deg">23° 45'</div>
          </div>
          <div class="planet-card">
            <div class="pc-top"><span class="pc-label">Moon</span> <span class="pc-glyph">☽</span></div>
            <div class="pc-val">Leo</div>
            <div class="pc-deg">12° 10'</div>
          </div>
          <div class="planet-card">
            <div class="pc-top"><span class="pc-label">Rising</span> <span class="pc-glyph">ASC</span></div>
            <div class="pc-val">Scorpio</div>
            <div class="pc-deg">05° 22'</div>
          </div>
          <div class="planet-card">
            <div class="pc-top"><span class="pc-label">Venus</span> <span class="pc-glyph">♀</span></div>
            <div class="pc-val">Aries</div>
            <div class="pc-deg">18° 30'</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item"><span class="ico">✦</span><span>Daily</span><div class="tab-rule"></div></div>
      <div class="tab-item"><span class="ico">◍</span><span>Transits</span><div class="tab-rule"></div></div>
      <div class="tab-item active"><span class="ico">☉</span><span>Chart</span><div class="tab-rule"></div></div>
      <div class="tab-item"><span class="ico">✧</span><span>Chat</span><div class="tab-rule"></div></div>
      <div class="tab-item"><span class="ico">◎</span><span>Profile</span><div class="tab-rule"></div></div>
    </div>
  </div>
  <div class="indicator"></div>
</div>
</body>
</html>
