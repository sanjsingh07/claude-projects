<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra — Your Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,700;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(9% 0.015 265);
  --surface: oklch(12% 0.018 265);
  --fg: oklch(98% 0.004 265);
  --muted: oklch(62% 0.018 265);
  --border: oklch(20% 0.02 265);
  --accent-violet: oklch(62% 0.18 290);
  --accent-pink: oklch(72% 0.22 10);
  --accent-amber: oklch(82% 0.18 75);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { display: flex; align-items: center; justify-content: center; }

.frame { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-radius: 47px; border: 1.5px solid var(--border); }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 10; }

.screen { flex: 1; display: flex; flex-direction: column; padding: 100px 32px 60px; text-align: center; }

.title { font-family: var(--font-display); font-size: 36px; font-style: italic; color: var(--fg); margin-bottom: 8px; }
.subtitle { font-family: var(--font-body); font-size: 14px; color: var(--muted); margin-bottom: 48px; }

.signature { display: flex; flex-direction: column; gap: 32px; margin-bottom: auto; }
.sig-item { display: flex; flex-direction: column; gap: 4px; }
.sig-label { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-violet); }
.sig-val { font-family: var(--font-display); font-size: 42px; color: var(--fg); }
.sig-glyph { font-size: 20px; color: var(--accent-pink); margin-top: 4px; }

.btn { 
  height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-body); font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  background: var(--fg); color: var(--bg);
}

.indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.3; z-index: 5; }

</style>
</head>
<body>
<div class="frame">
  <div class="island"></div>
  
  <div class="screen">
    <div class="title">The Stars are Aligned</div>
    <div class="subtitle">Your cosmic signature is ready, Eleanor.</div>

    <div class="signature">
      <div class="sig-item">
        <div class="sig-label">Sun</div>
        <div class="sig-val">Taurus</div>
        <div class="sig-glyph">☉</div>
      </div>
      <div class="sig-item">
        <div class="sig-label">Moon</div>
        <div class="sig-val">Leo</div>
        <div class="sig-glyph">☽</div>
      </div>
      <div class="sig-item">
        <div class="sig-label">Rising</div>
        <div class="sig-val">Scorpio</div>
        <div class="sig-glyph">ASC</div>
      </div>
    </div>

    <div class="btn">Enter the Sanctuary</div>
  </div>
  <div class="indicator"></div>
</div>
</body>
</html>
