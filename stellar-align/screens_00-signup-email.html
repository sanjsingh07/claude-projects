<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Align — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(9% 0.015 265);
  --surface: oklch(12% 0.018 265);
  --fg: oklch(98% 0.004 265);
  --muted: oklch(62% 0.018 265);
  --border: oklch(20% 0.02 265);
  --accent-violet: oklch(62% 0.18 290);
  --accent-pink: oklch(72% 0.22 10);
  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { display: flex; align-items: center; justify-content: center; }

.frame { width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-radius: 47px; border: 1.5px solid var(--border); }
.island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 10; }

.screen { flex: 1; display: flex; flex-direction: column; padding: 80px 32px 60px; }

.progress-container { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 48px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.dot.active { background: var(--accent-violet); box-shadow: 0 0 8px var(--accent-violet); }
.line { width: 40px; height: 1px; background: var(--border); }

.header { margin-bottom: 40px; }
.logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.logo-sym { font-size: 32px; color: var(--fg); }

.title { font-family: var(--font-display); font-size: 36px; font-style: italic; color: var(--fg); line-height: 1.1; margin-bottom: 8px; text-transform: uppercase; }
.subtitle { font-family: var(--font-body); font-size: 15px; color: var(--muted); }

.form { display: flex; flex-direction: column; gap: 24px; flex: 1; }
.input-group { display: flex; flex-direction: column; gap: 8px; }
.label { font-family: var(--font-body); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.input { 
  height: 52px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 0 16px; font-family: var(--font-body); font-size: 15px; color: var(--fg);
  display: flex; align-items: center; width: 100%; outline: none;
}
.input::placeholder { color: var(--muted); }

.btn { 
  height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-body); font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  background: var(--fg); color: var(--bg); border: none; margin-top: auto;
}

.footer { margin-top: 24px; text-align: center; }
.footer-text { font-family: var(--font-body); font-size: 14px; color: var(--muted); }
.footer-link { color: var(--accent-violet); text-decoration: none; font-weight: 500; }

.indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: 0.3; z-index: 5; }

</style>
</head>
<body>
<div class="frame">
  <div class="island"></div>
  
  <div class="screen">
    <div class="progress-container">
      <div class="dot active"></div>
      <div class="line"></div>
      <div class="dot"></div>
    </div>

    <div class="header">
      <div class="logo-row">
        <span class="logo-sym">☉</span>
        <span class="logo-sym" style="opacity: 0.4">☽</span>
      </div>
      <h2 class="title">Create Account</h2>
      <p class="subtitle">Begin your cosmic journey</p>
    </div>

    <div class="form">
      <div class="input-group">
        <label class="label">Email</label>
        <div class="input">your@email.com</div>
      </div>

      <div class="input-group">
        <label class="label">Password</label>
        <div class="input">Min 8 characters</div>
      </div>

      <div class="input-group">
        <label class="label">Confirm Password</label>
        <div class="input">Repeat password</div>
      </div>

      <button class="btn">Continue</button>
    </div>

    <div class="footer">
      <p class="footer-text">Already have an account? <a href="screens_00-login.html" class="footer-link">Log In</a></p>
    </div>
  </div>
  
  <div class="indicator"></div>
</div>
</body>
</html>
